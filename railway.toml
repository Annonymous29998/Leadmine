# Railway — LeadMine API (frontend on Vercel)
#
# App must listen on "::" with ipv6Only:false (see apps/api/src/index.ts).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.api"

[deploy]
startCommand = "/app/scripts/railway-entrypoint.sh"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
