# Railway — LeadMine Extractor
#
# Why deploys failed before:
# Railway's proxy/healthcheck reaches containers over IPv6.
# Listening on 0.0.0.0 is IPv4-only → healthcheck = "service unavailable"
# even when the app is running. Fix: bind host "::" (dual-stack).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
