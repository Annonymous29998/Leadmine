# Railway — LeadMine Extractor
#
# Root cause of repeated "service unavailable" healthchecks:
# Railway reaches containers over IPv6. Binding 0.0.0.0 is IPv4-only.
# App must listen on "::" with ipv6Only:false (see apps/api/src/index.ts).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/app/scripts/railway-entrypoint.sh"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
